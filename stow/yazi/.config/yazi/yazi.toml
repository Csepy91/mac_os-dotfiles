# https://yazi-rs.github.io/docs/configuration/yazi
[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
sort_translit = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
max_width = 1200
max_height = 1800
image_delay = 30
tab_size = 2

# Enter/o runs the *first* matching opener.
[opener]
edit = [
  { run = 'nano %s', desc = "nano", block = true, for = "unix" },
  { run = 'cursor %s', orphan = true, desc = "Cursor", for = "macos" },
]
play = [
  { run = 'open -a IINA %s', orphan = true, desc = "IINA", for = "macos" },
]
open = [
  { run = 'open %s', desc = "Open", for = "macos" },
]
reveal = [
  { run = 'open -R %s', desc = "Reveal", for = "macos" },
]

[open]
rules = [
  { url = "*/", use = [ "open", "reveal" ] },
  { mime = "text/*", use = [ "edit", "open", "reveal" ] },
  { mime = "image/*", use = [ "open", "reveal" ] },
  { mime = "video/*", use = [ "play", "open", "reveal" ] },
  { mime = "audio/*", use = [ "play", "open", "reveal" ] },
  { mime = "application/pdf", use = [ "open", "reveal" ] },
  # Common containers sometimes mis-detected as octet-stream
  { url = "*.{mp4,mkv,webm,avi,mov,m4v,mp3,flac,m4a,aac,wav,opus}", use = [ "play", "open", "reveal" ] },
  { url = "*", use = [ "open", "reveal" ] },
]
